<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Boxes.py Live</title>
    <link rel="icon" href="data:," />
  </head>
  <body>
    <aside id="sidebar">
      <header>
        <h1>Boxes.py <span>Live</span></h1>
        <p id="status" role="status">Starting…</p>
      </header>
      <label class="picker">
        Generator
        <input id="generator-filter" type="search" placeholder="Filter generators…" spellcheck="false" disabled />
        <select id="generator" disabled></select>
      </label>
      <p id="doc"></p>
      <div class="export-bar">
        <div class="export-row">
          <select id="export-format" title="Export format" disabled>
            <optgroup label="2D Laser / CNC">
              <option value="svg">SVG (2D sheet)</option>
              <option value="svg-parts">SVG (each part, .zip)</option>
              <option value="lbrn2">LightBurn (.lbrn2)</option>
              <option value="ps">PostScript (.ps)</option>
              <option value="svg_Ponoko">SVG Ponoko (.svg)</option>
            </optgroup>
            <optgroup label="3D Print / CAD">
              <option value="stl-assembly">STL (3D assembly)</option>
              <option value="stl-zip">STL (each part flat, .zip)</option>
              <option value="stl-part">STL (single part…)</option>
            </optgroup>
          </select>
          <button id="download" disabled>Download</button>
          <button id="reset" class="secondary" title="Reset parameters to defaults">Reset</button>
        </div>
        <select id="export-part" title="Part to export as STL" hidden></select>
        <label id="print-clearance-row" class="export-row" hidden
               title="Play per joint for printed parts: every part shrinks by half of this on each side. The laser kerf (burn) is not used for STL.">
          Print clearance
          <input id="print-clearance" type="number" min="0" max="2" step="0.05" value="0.15" /> mm
        </label>
      </div>
      <form id="form" onsubmit="return false"></form>
      <p id="about">
        Experimental, based on <a href="https://github.com/florianfesti/boxes">Boxes.py</a>.
        <a href="https://github.com/dieli/boxes/tree/live-preview/web">Source</a> (GPL-3.0) ·
        <a href="THIRD_PARTY_LICENSES.txt">Third-party licences</a>
      </p>
    </aside>
    <main>
      <div id="toolbar">
        <button id="zoom-out" title="Zoom out">−</button>
        <button id="zoom-fit" title="Fit">Fit</button>
        <button id="zoom-in" title="Zoom in">+</button>
        <button id="undo" title="Undo (Ctrl+Z)" disabled>↶</button>
        <button id="redo" title="Redo (Ctrl+Y / Ctrl+Shift+Z)" disabled>↷</button>
        <span id="sheet-size" title="2D sheet bounding box"></span>
        <span id="timing"></span>
      </div>
      <div id="error" role="alert" hidden></div>
      <div id="views">
        <div id="preview"></div>
        <section id="panel3d">
          <div id="canvas3d"></div>
          <div class="controls3d">
            <div class="mode3d" role="group" aria-label="Mode">
              <button id="mode-view" class="secondary active" aria-pressed="true" title="Orbit and select parts">View</button>
              <button id="mode-edit" class="secondary" aria-pressed="false" title="Change compartments, walls and floors in 3D" disabled>Edit</button>
            </div>
            <button id="convert-tray" class="secondary" hidden
              title="Same grid as a TrayLayout, where single wall pieces and floors can be removed (TypeTray-only options like grip holes and labels are not carried over)">Convert to TrayLayout</button>
            <label id="snap-ctl" hidden title="Dragged walls snap compartment sizes to this step; hold Shift to move freely">
              Snap <select id="snap"><option value="1">1 mm</option><option value="5">5 mm</option></select>
            </label>
            <label>Explode <input id="explode" type="range" min="0" max="1" step="0.01" value="0" /></label>
            <label><input id="show-dims" type="checkbox" checked /> Dimensions</label>
            <button id="reset-camera" class="secondary" title="Reset camera">Reset view</button>
          </div>
          <details id="parts3d" open>
            <summary>Parts <span id="parts-count"></span></summary>
            <div class="parts-actions">
              <button id="show-all" class="secondary">Show all</button>
              <button id="hide-all" class="secondary">Hide all</button>
            </div>
            <ul id="parts-list"></ul>
          </details>
          <p id="assembly-error" role="status" hidden></p>
          <p id="flat-note" hidden></p>
          <p id="edit-hint" hidden></p>
          <div id="no3d" hidden>
            <p><strong>3D view not implemented yet</strong> for <span id="no3d-name"></span>.</p>
            <p>The 2D sheet and downloads work as usual.</p>
          </div>
        </section>
      </div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
